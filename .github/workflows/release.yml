name: Build binaries and create release

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: dolbaeb-simulator-linux-x86_64-glibc
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: dolbaeb-simulator-linux-x86_64-musl
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: dolbaeb-simulator-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies (glibc)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-suggests --no-install-recommends install libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev pkg-config

      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get -yq --no-install-suggests --no-install-recommends install musl-tools autoconf libtool pkg-config

      - name: Build static ALSA for musl
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          wget -q https://github.com/alsa-project/alsa-lib/archive/refs/tags/v1.2.11.tar.gz -O alsa-lib.tar.gz
          tar xzf alsa-lib.tar.gz
          cd alsa-lib-1.2.11
          CC=musl-gcc ./configure \
            --build=x86_64-unknown-linux-gnu \
            --host=x86_64-linux-musl \
            --prefix=/usr/local/musl-alsa \
            --disable-shared \
            --enable-static
          make -j"$(nproc)"
          sudo make install

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set musl linker and library paths
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-L native=/usr/local/musl-alsa/lib" >> "$GITHUB_ENV"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Verify Linux binary
        if: runner.os == 'Linux'
        run: file target/${{ matrix.target }}/release/dolbaeb-simulator

      - name: Stage binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/dolbaeb-simulator.exe \
             ${{ matrix.artifact }} 2>/dev/null || \
          cp target/${{ matrix.target }}/release/dolbaeb-simulator \
             ${{ matrix.artifact }}
          chmod +x ${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Compute release tag
        id: tag
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=v${VERSION}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Dolbaeb Simulator ${{ steps.tag.outputs.tag }}
          files: dist/**
          generate_release_notes: true
          fail_on_unmatched_files: true
